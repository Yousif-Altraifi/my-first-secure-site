<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOUSIF ALTRAIFI - Secure Scanner V2.2</title>
<link rel="manifest" href="/manifest.json">
<style>
body{background:#0a0f1e;color:#fff;font-family:Tahoma;text-align:center;padding:20px}
.box{max-width:500px;margin:40px auto;background:#111a33;padding:25px;border-radius:15px;box-shadow:0 0 20px #00ff8844}
input{width:90%;padding:12px;border-radius:8px;border:none;margin:15px 0;font-size:16px;direction:ltr}
button{background:#00ff88;color:#000;padding:12px 25px;border:none;border-radius:8px;font-weight:bold;font-size:18px;cursor:pointer;width:95%}
#result{margin-top:20px;padding:15px;border-radius:8px;font-size:18px;display:none}
.safe{background:#00ff8833;border:1px solid #00ff88;color:#00ff88}
.danger{background:#ff004433;border:1px solid #ff0044;color:#ff5577}
.warn{background:#ffcc0033;border:1px solid #ffcc00;color:#ffdd55}
h1{color:#00ff88}
</style>
</head>
<body>
<h1>YOUSIF ALTRAIFI</h1>
<h2>Secure Scanner V2.2</h2>
<p>Phishing Detector - By Cybersecurity Student from Sudan</p>
<div class="box">
<input type="text" id="urlInput" placeholder="https://example.com">
<button onclick="scan()">[ افحص الان ]</button>
<div id="result"></div>
</div>
<script>
function scan(){
let url=document.getElementById('urlInput').value.trim();
let res=document.getElementById('result');
if(!url){alert('أدخل رابط!');return}
res.style.display='block';
let score=0; let reasons=[];
if(url.length>75){score+=2;reasons.push('رابط طويل');}
if(url.includes('@')){score+=3;reasons.push('يحتوي @');}
if(url.match(/^https?:\/\/\d+\.\d+\.\d+\.\d+/)){score+=3;reasons.push('IP بدل دومين');}
if(!url.startsWith('https')){score+=2;reasons.push('بدون HTTPS');}
if(url.includes('bit.ly')||url.includes('tinyurl')){score+=2;reasons.push('رابط مختصر');}
if(score>=5){res.className='danger';res.innerHTML='❌ خطير - تصيد!<br><small>'+reasons.join(' - ')+'</small>';}
else if(score>=2){res.className='warn';res.innerHTML='⚠️ مشبوه!<br><small>'+reasons.join(' - ')+'</small>';}
else{res.className='safe';res.innerHTML='✅ آمن نسبياً';}
}
</script>
</body>
</html>
